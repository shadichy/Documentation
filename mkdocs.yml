          - Setup Linux's GRUB2: installation/manual/setup-linux-grub2.md
          - Setup rEFInd: installation/manual/setup-refind.md
      - Install on a Virtual Machine: installation/vm.md
  - Configuration:
      - configuration/README.md
      - Audio: configuration/audio.md
      - Display: configuration/display.md
      - Graphics:
        - configuration/graphics/README.md
        - DriConf: configuration/graphics/driconf.md
        - Intel GPUs: configuration/graphics/intel.md
        - AMD GPUs: configuration/graphics/amd-radeon.md
        - Nvidia GPUs: configuration/graphics/nvidia.md
        - VirGL: configuration/graphics/virtio.md
        - VMWare SVGA: configuration/graphics/vmware.md
      - Media codecs: configuration/media-codecs.md
      - Sensors: configuration/sensors.md
      - Touchscreen:
        - Calibrate and configure iptsd: configuration/touchscreens/calibrate-configure-iptsd.md
        - Calibrate and configure silead touchscreens: configuration/touchscreens/calibrate-configure-silead.md
      - Grant superuser permission or debug shell: configuration/grantsu.md
      - Preparing a Virtual Machine: configuration/vm-setup.md
      - Pseudo fstab: configuration/pseudo-filesystem-table.md
      - Setup kernel's cmdline parameters: configuration/kernel-parameters.md
