site_name: Bliss OS Documentation
repo_name: BlissOS/Documentation
repo_url: https://github.com/BlissRoms-x86/Documentation
theme:
  name: material
  favicon: assets/images/favicon.png
  custom_dir: assets_main
  palette:
    - scheme: blisslight
      primary: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Google Sans Flex
    code: Google Sans Code
  icon:
    logo: blissos
    annotation: material/plus-circle
  features:
    - navigation.indexes
    - navigation.top
    - toc.integrate
    - content.code.copy
    - content.code.annotate
extra_css:
  - assets/extra.css
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - attr_list
  - md_in_html
  - pymdownx.blocks.caption
extra:
  social:
    - icon: octicons/globe-16
      link: https://blissos.org/
    - icon: fontawesome/brands/x-twitter
      link: https://twitter.com/blissos_org
    - icon: fontawesome/brands/telegram
      link: https://t.me/blissx86
    - icon: fontawesome/brands/discord
      link: https://discord.com/invite/F9n5gbdNy2
copyright: Copyright © 2013 - 2026 BlissLabs
